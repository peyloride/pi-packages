version: '3.8'

services:
  dashboard:
    build: .
    container_name: pi-extension-dashboard
    ports:
      - "3000:3000"
    volumes:
      - dashboard-data:/app/data
    environment:
      - PORT=3000
      - DB_PATH=/app/data/dashboard.db
      - SYNC_CRON=0 * * * *
      - SYNC_FULL_CRON=0 3 * * *
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  dashboard-data:
    driver: local
