<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Extension Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>π Extension Dashboard</h1>
      <p class="subtitle">Discover trending pi extensions</p>
    </header>

    <nav class="tabs">
      <button class="tab active" data-sort="trending">🔥 Trending</button>
      <button class="tab" data-sort="popular">⭐ Popular</button>
      <button class="tab" data-sort="alltime">📈 All Time</button>
      <button class="tab" data-sort="new">✨ New</button>
      <button class="tab" data-sort="updated">📦 Updated</button>
    </nav>

    <div class="search-bar">
      <input type="search" id="search" placeholder="Search packages..." autocomplete="off">
      <span class="search-icon">🔍</span>
    </div>

    <div id="stats" class="stats"></div>

    <main id="packages" class="packages">
      <div class="loading">Loading packages...</div>
    </main>

    <div id="pagination" class="pagination"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
